<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Preview Simulation</title>
    <style>
        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Fira Sans", Ubuntu, Oxygen, "Oxygen Sans", Cantarell, "Droid Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Lucida Grande", Helvetica, Arial, sans-serif;
            background-color: #f3f2ef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* LinkedIn Card Simulation Container */
        .linkedin-card {
            width: 552px;
            background-color: #fff;
            border-radius: 8px; /* Newer cards have rounded corners */
            overflow: hidden;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.15), 0 2px 3px rgba(0,0,0,0.2);
            cursor: pointer;
            text-decoration: none;
            display: block;
            color: inherit;
        }

        /* Image Container - Enforces 1.91:1 Aspect Ratio */
        .linkedin-image-container {
            width: 100%;
            padding-bottom: 52.35%; /* 1 / 1.91 = ~52.35% */
            position: relative;
            background-color: #eef3f8; /* Placeholder color before load */
        }

        .linkedin-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Simulates how LinkedIn fills the space */
            display: block;
        }

        /* Content Area below image */
        .linkedin-content {
            padding: 8px 16px;
            background-color: #fff; /* LinkedIn background for content area */
            border-top: 1px solid #e0e0e0; /* Subtle separator from image */
        }

        .linkedin-title {
            font-size: 16px;
            font-weight: 600;
            color: rgba(0, 0, 0, 0.9);
            line-height: 24px;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .linkedin-domain {
            font-size: 12px;
            color: rgba(0, 0, 0, 0.6);
            line-height: 16px;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .note {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff; 
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
            max-width: 600px;
        }
    </style>
</head>
<body>

    <div class="note">
        <strong>Local Simulation:</strong> This shows how your 1200x630 image will likely be cropped/displayed by LinkedIn.<br>
        To see the real preview, deploy your changes and use the <a href="https://www.linkedin.com/post-inspector/" style="color: #fff; text-decoration: underline;">LinkedIn Post Inspector</a>.
    </div>

    <!-- Simulated Card Structure -->
    <a href="#" class="linkedin-card">
        <div class="linkedin-image-container">
            <!-- Loading the local image directly -->
            <img src="bic-logo.jpg" alt="Behavioral Interview Coach Preview" class="linkedin-image">
        </div>
        <div class="linkedin-content">
            <h3 class="linkedin-title">Behavioral Coach | Structure</h3>
            <div class="linkedin-domain">behavioral-interview-coach.vercel.app</div>
        </div>
    </a>

</body>
</html>
